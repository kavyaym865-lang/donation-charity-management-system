<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title if title else "Donation & Charity App" }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .navbar-brand img {
            height: 40px;
            margin-right: 10px;
        }
        .trusted-logo {
            height: 35px;
            margin-left: 10px;
        }
        .navbar {
            position: relative;
            z-index: 10;
        }
        .container {
            position: relative;
            z-index: 1;
        }
          footer {
            background: #f1f1f1;
            padding: 15px;
            margin-top: 40px;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">

        <!-- ★ Charity Logo Added -->
        <a class="navbar-brand d-flex align-items-center" href="/">
            <img src="/static/logos/charity_logo.png" alt="Charity Logo">
            CharityConnect
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/admin/login">Admin</a></li>
                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/charities">Charities</a></li>
                <li class="nav-item"><a class="nav-link" href="/donate">Donate</a></li>
            </ul>

            <!-- ★ Trusted Logo Added -->
            <img src="/static/logos/trusted_logo.png" class="trusted-logo" alt="Trusted Logo">

        </div>
    </div>
</nav>

<div class="container mt-4">
    {% block content %}{% endblock %}
</div>

<footer class="text-center">
    <p>© {{ year }} CharityConnect. All rights reserved.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
