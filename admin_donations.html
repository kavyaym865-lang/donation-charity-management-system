<h2>All Donations</h2>
<table class="table table-bordered">
    <tr>
        <th>ID</th>
        <th>Donor</th>
        <th>Amount</th>
        <th>Payment Mode</th>
        <th>Transaction ID</th>
        <th>Date</th>
    </tr>

    {% for d in donations %}
    <tr>
        <td>{{ d.id }}</td>
        <td>{{ d.donor_name }}</td>
        <td>{{ d.amount }}</td>
        <td>{{ d.payment_method }}</td>
        <td>{{ d.transaction_id }}</td>
        <td>{{ d.created_at }}</td>
    </tr>
    {% endfor %}
</table>
