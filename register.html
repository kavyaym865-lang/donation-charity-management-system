<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f6f6f6;
            padding: 20px;
        }
        .container {
            background: white;
            max-width: 450px;
            margin: auto;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 8px rgba(0,0,0,0.1);
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            background: #4CAF50;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        h2 {
            text-align: center;
        }
        .hint-box {
            font-size: 13px;
            background: #fff3cd;
            padding: 10px;
            border-left: 4px solid #ffa502;
            border-radius: 5px;
            color: #7a5d00;
            margin-top: -5px;
            margin-bottom: 10px;
        }
        .forgot {
            text-align: right;
            margin-top: -5px;
            margin-bottom: 10px;
        }
        .forgot a {
            color: #007BFF;
            font-size: 14px;
            text-decoration: none;
        }
        .forgot a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
<div class="container">
    <h2>Create Account</h2>

    <form method="POST">

        <label>Name</label>
        <input type="text" name="name" required>

        <label>Email</label>
        <input type="email" name="email" required>

        <label>Password</label>
        <input type="password" name="password" maxlength="8" required>

        <!-- Password Hint -->
        <div class="hint-box">
            Password must contain:<br>
            • Exactly 8 characters<br>
            • At least 1 capital letter (A–Z)<br>
            • At least 1 small letter (a–z)<br>
            • At least 1 number (0–9)<br>
            • Only '@' allowed as special character
        </div>

        <label>Aadhaar Number</label>
        <input type="text" name="aadhaar" maxlength="12" placeholder="12-digit Aadhaar" required>

        <button type="submit">Register</button>

        <p style="text-align:center; margin-top:10px;">
            If you have an account? <a href="/login">Login</a>
        </p>

    </form>

</div>
</body>
</html>
