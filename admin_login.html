<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 40px;
        }
        .login-box {
            width: 360px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid #ccc;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #0066ff;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover {
            background: #0051d4;
        }
    </style>
</head>

<body>

<div class="login-box">
    <h2 class="text-center">Admin Login</h2>

    <form method="POST" autocomplete="off">

        <!-- Unique name so browser won't auto-fill -->
        <label>Admin Username</label>
        <input type="text" name="admin_username" id="admin_username" autocomplete="new-admin" required>

        <label>Password</label>
        <input type="password" name="admin_password" id="admin_password" autocomplete="new-password" required>

        <button type="submit">Login</button>
    </form>
</div>

</body>
</html>
